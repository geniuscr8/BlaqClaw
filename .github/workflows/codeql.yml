name: CodeQL Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Android code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ""
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      # Autobuild cannot reliably discover this Kotlin/Android Gradle project.
      # Compile the release sources without producing a debug APK artifact.
      - name: Build for CodeQL
        run: ./gradlew --no-daemon :app:compileReleaseKotlin :app:compileReleaseJavaWithJavac -x lint -x test
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
