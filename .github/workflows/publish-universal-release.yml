name: Publish Universal APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build universal debug APK
        run: ./gradlew assembleDebug

      - name: Publish permanent GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="universal-${GITHUB_SHA::12}"
          gh release create "$tag" app/build/outputs/apk/debug/*universal*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "BlaqClaw Universal APK ($tag)" \
            --notes "Universal debug APK built from commit $GITHUB_SHA. This release asset does not expire like a GitHub Actions artifact." \
            --prerelease \
            --latest=false
