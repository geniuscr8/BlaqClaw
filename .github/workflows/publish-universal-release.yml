name: Publish Universal APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then echo "::error::Missing required Actions secret: $var"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          key_path="$RUNNER_TEMP/blaqclaw-release.keystore"
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$key_path"
          cat > local.properties <<EOF
          KEYSTORE_FILE=$key_path
          KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          KEY_ALIAS=$ANDROID_KEY_ALIAS
          KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed universal APK
        run: ./gradlew assembleRelease

      - name: Publish permanent GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep one stable, non-expiring download instead of accumulating old APKs.
          tag="universal-latest"
          old_tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,name,isPrerelease \
            --jq '.[] | select(.isPrerelease == true and (.name | startswith("BlaqClaw Universal APK"))) | .tagName')
          while IFS= read -r old_tag; do
            [ -z "$old_tag" ] || gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done <<< "$old_tags"
          gh release create "$tag" app/build/outputs/apk/release/*universal*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "BlaqClaw Universal APK ($tag)" \
            --notes "Signed universal APK built from commit $GITHUB_SHA. This stable release replaces the previous universal APK and does not expire like a GitHub Actions artifact." \
            --latest=false
